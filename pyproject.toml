[project]
name = "swarthmore-budget"
version = "1.1.0"
description = "Open, reproducible analysis of Swarthmore Borough (PA) public financial documents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pdfplumber>=0.11",
    "pillow>=11",
    "pytesseract>=0.3.13",
    "requests>=2.32",
]

[tool.uv]
# This repo is a collection of scripts, not an installable package.
package = false

[tool.ruff]
line-length = 110
